Background@KICK_CLIENT_DIALOG:
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Logic: KickClientLogic
	Background: dialog3
	Children:
		Label@TITLE:
			Y: 41
			Width: PARENT_WIDTH
			Height: 25
			Font: Bold
			Align: Center
		Label@TEXTA:
			Y: 68
			Width: PARENT_WIDTH
			Height: 25
			Font: Regular
			Align: Center
			Text: Chrome-LobbyKickDialogs-Text
		Label@TEXTB:
			Y: 86
			Width: PARENT_WIDTH
			Height: 25
			Font: Regular
			Align: Center
			Text: Chrome-LobbyKickDialogs-Checkbox
		Checkbox@PREVENT_REJOINING_CHECKBOX:
			X: (PARENT_WIDTH - WIDTH) / 2
			Y: 120
			Width: 150
			Height: 20
			Text: Chrome-LobbyKickDialogs-OkButton
		Button@OK_BUTTON:
			X: (PARENT_WIDTH - WIDTH) / 2 + 75
			Y: 155
			Width: 120
			Height: 25
			Text: Chrome-LobbyKickDialogs-OkButton
			Font: Bold
		Button@CANCEL_BUTTON:
			X: (PARENT_WIDTH - WIDTH) / 2 - 75
			Y: 155
			Width: 120
			Height: 25
			Text: Chrome-LobbyKickDialogs-CancelButton
			Font: Bold

