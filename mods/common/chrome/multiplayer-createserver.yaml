			X: 110
			Y: 45
			Width: 215
			MaxLength: 50
			Height: 25
			Text: Chrome-MPCreateServer-ServerNamePlaceHolder
		Label@PASSWORD_LABEL:
			Y: 80
			Width: 105
			Height: 25
			Align: Right
			Text: Chrome-MPCreateServer-Passwd
