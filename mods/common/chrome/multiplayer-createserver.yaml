Background@MULTIPLAYER_CREATESERVER_PANEL:
	Logic: ServerCreationLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 530
	Height: 315
	Children:
		Label@TITLE:
			Y: 16
			Width: PARENT_WIDTH
			Height: 25
			Text: Chrome-MPCreateServer-Title
			Align: Center
			Font: Bold
