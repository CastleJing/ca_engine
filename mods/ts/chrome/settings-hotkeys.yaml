Container@HOTKEYS_PANEL:
	Logic: HotkeysSettingsLogic
		HotkeyGroups:
			Chrome-Setting-Hotkey-HotkeyGroups-GameCommands:
				Types: OrderGenerator, World, Menu
			Chrome-Setting-Hotkey-HotkeyGroups-ViewportCommands:
				Types: Viewport
			Chrome-Setting-Hotkey-HotkeyGroups-ObserverReplayCommands:
				Types: Observer, Replay
			Chrome-Setting-Hotkey-HotkeyGroups-UnitCommands:
				Types: Unit
			Chrome-Setting-Hotkey-HotkeyGroups-UnitStanceCommands:
				Types: Stance
			Chrome-Setting-Hotkey-HotkeyGroups-ProductionCommands:
				Types: Production, ProductionSlot
			Chrome-Setting-Hotkey-HotkeyGroups-SupportPowerCommands:
				Types: SupportPower
			Chrome-Setting-Hotkey-HotkeyGroups-MusicCommands:
				Types: Music
			Chrome-Setting-Hotkey-HotkeyGroups-ChatCommands:
				Types: Chat
			Chrome-Setting-Hotkey-HotkeyGroups-ControlGroups:
				Types: ControlGroups
			Chrome-Setting-Hotkey-HotkeyGroups-EditorCommands:
				Types: Editor
			hotkey-group-depth-preview-debug:
				Types: DepthDebug
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Label@FILTER_INPUT_LABEL:
			Width: 103
			Height: 25
			Font: Bold
			Text: Chrome-Setting-Hotkey-FilterPlaceholder
		TextField@FILTER_INPUT:
			X: 108
			Width: 180
			Height: 25
		Label@CONTEXT_DROPDOWN_LABEL:
			X: PARENT_WIDTH - WIDTH - 195 - 5
			Width: 100
			Height: 25
			Font: Bold
			Text: Chrome-Setting-Hotkey-ContextLabel
			Align: Right
		DropDownButton@CONTEXT_DROPDOWN:
			X: PARENT_WIDTH - WIDTH
			Width: 195
			Height: 25
			Font: Bold
		ScrollPanel@HOTKEY_LIST:
			Y: 35
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT - 65 - 35
			TopBottomSpacing: 5
			ItemSpacing: 5
			Children:
				Container@HEADER:
					Width: PARENT_WIDTH - 24 - 10
					Height: 18
					Children:
						Background@BACKGROUND:
							Width: PARENT_WIDTH
							Height: 13
							Background: separator
							ClickThrough: True
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: 13
							Font: TinyBold
							Align: Center
				Container@TEMPLATE:
					Width: (PARENT_WIDTH - 24) / 2 - 10
					Height: 30
					Visible: false
					Children:
						Label@FUNCTION:
							Y: 0 - 1
							Width: PARENT_WIDTH - 120 - 5
							Height: 25
							Align: Right
						Button@HOTKEY:
							X: PARENT_WIDTH - WIDTH
							Width: 120
							Height: 25
							TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
		Container@HOTKEY_EMPTY_LIST:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Visible: false
			Children:
				Label@HOTKEY_EMPTY_LIST_MESSAGE:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Align: Center
					Text: Chrome-Setting-Hotkey-EmptyList
		Background@HOTKEY_REMAP_BGND:
			Y: PARENT_HEIGHT - HEIGHT
			Width: PARENT_WIDTH
			Height: 65
			Background: dialog3
			Children:
				Container@HOTKEY_REMAP_DIALOG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@HOTKEY_LABEL:
							X: 15
							Y: 19
							Width: 200
							Height: 25
							Font: Bold
							Align: Right
						HotkeyEntry@HOTKEY_ENTRY:
							X: 15 + 200 + 5
							Y: 20
							Width: 300
							Height: 25
						Container@NOTICES:
							X: 15 + 200 + 5
							Y: 42
							Width: 300
							Height: 25
							Children:
								Label@ORIGINAL_NOTICE:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Font: Tiny
								Label@DUPLICATE_NOTICE:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Font: Tiny
								Label@READONLY_NOTICE:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Font: Tiny
									Text: Chrome-Setting-Hotkey-ReadOnlyNotice
						Button@OVERRIDE_HOTKEY_BUTTON:
							X: PARENT_WIDTH - 3 * WIDTH - 30
							Y: 20
							Width: 70
							Height: 25
							Text: Chrome-Setting-Hotkey-OverrideButton
							Font: Bold
						Button@CLEAR_HOTKEY_BUTTON:
							X: PARENT_WIDTH - 2 * WIDTH - 30
							Y: 20
							Width: 65
							Height: 25
							Text: Chrome-Setting-Hotkey-Clear
							Font: Bold
							TooltipText: Chrome-Setting-Hotkey-Clear-Tooltip
							TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						Button@RESET_HOTKEY_BUTTON:
							X: PARENT_WIDTH - WIDTH - 20
							Y: 20
							Width: 65
							Height: 25
							Text: Chrome-Setting-Hotkey-Reset
							Font: Bold
							TooltipText: Chrome-Setting-Hotkey-Reset-Tooltip
							TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
