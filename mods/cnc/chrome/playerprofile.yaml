Container@LOCAL_PROFILE_PANEL:
	Logic: LocalProfileLogic
	Width: 270
	Height: 100
	Children:
		Background@PROFILE_HEADER:
			Width: PARENT_WIDTH
			Height: 50
			Background: panel-black
			Children:
				Label@PROFILE_NAME:
					X: 10
					Y: 5
					Width: PARENT_WIDTH - 20
					Height: 25
					Font: MediumBold
				Label@PROFILE_RANK:
					X: 10
					Y: 24
					Width: PARENT_WIDTH - 20
					Height: 25
					Font: TinyBold
				Button@DESTROY_KEY:
					X: PARENT_WIDTH - 70
					Y: 15
					Width: 60
					Height: 20
					Font: TinyBold
					Text: Chrome-PlayerProfile-Logout
		Background@BADGES_CONTAINER:
			Width: PARENT_WIDTH
			Y: 48
			Visible: false
			Background: panel-black
		Background@GENERATE_KEYS:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@DESC_A:
					Y: 6
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-GenKey
				Label@DESC_B:
					Y: 22
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-GenKeyButton
				Label@DESC_C:
					Y: 38
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-GenKey
				Button@GENERATE_KEY:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Font: TinyBold
					Text: Chrome-PlayerProfile-GenKeyButton
		Background@GENERATING_KEYS:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@DESC_A:
					Y: 14
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Gening
				Label@DESC_B:
					Y: 30
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Gening
				ProgressBar:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Indeterminate: true
		Background@REGISTER_FINGERPRINT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@DESC_A:
					Y: 3
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Register
				Label@DESC_B:
					Y: 19
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Register
				Label@DESC_C:
					Y: 35
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Register
				Button@DELETE_KEY:
					X: 15
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Chrome-PlayerProfile-Register-CancelButton
				Button@CHECK_KEY:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Chrome-PlayerProfile-Register-ContinueButton
		Background@CHECKING_FINGERPRINT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@DESC_A:
					Y: 14
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Checking
				Label@DESC_B:
					Y: 30
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-Checking
				ProgressBar:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Indeterminate: true
		Background@FINGERPRINT_NOT_FOUND:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@DESC_A:
					Y: 14
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-NotFound
				Label@DESC_B:
					Y: 30
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-NotFound
				Button@FINGERPRINT_NOT_FOUND_CONTINUE:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Chrome-PlayerProfile-NotFound-BackButton
		Background@CONNECTION_ERROR:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@DESC_A:
					Y: 14
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-ConnectError
				Label@DESC_B:
					Y: 30
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: Chrome-PlayerProfile-ConnectError
				Button@CONNECTION_ERROR_RETRY:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Chrome-Connection-RetryButton

