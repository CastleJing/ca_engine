			Height: 25
			Children:
				Badge@ICON:
					X: 6
					Y: 1
					Width: 24
					Height: 24
				Label@LABEL:
					X: 36
					Y: 2
					Width: PARENT_WIDTH - 60
					Height: 24
					Font: Bold
