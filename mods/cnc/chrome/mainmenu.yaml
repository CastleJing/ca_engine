Container@MENU_BACKGROUND:
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Logic: MainMenuLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		Container@SHELLMAP_DECORATIONS:
			Children:
				Image@NOD:
					X: WINDOW_WIDTH / 2 - 384
					Y: (WINDOW_HEIGHT - 256) / 2
					ImageCollection: logos
					ImageName: nod-load
				Image@GDI:
					X: WINDOW_WIDTH / 2 + 128
					Y: (WINDOW_HEIGHT - 256) / 2
					ImageCollection: logos
					ImageName: gdi-load
		Image@EVA:
			X: WINDOW_WIDTH - 128 - 43
			Y: 43
			Width: 128
			Height: 64
			ImageCollection: logos
			ImageName: eva
		Label@VERSION_LABEL:
			Logic: VersionLabelLogic
			X: WINDOW_WIDTH - 128 - 43
			Y: 116
			Width: 128
			Align: Center
			Shadow: true
		Background@BORDER:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			Background: shellmapborder
		Container@MENUS:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: WINDOW_HEIGHT - 33 - HEIGHT - 10
			Width: 890
			Height: 35
			Children:
				Container@MAIN_MENU:
					Width: PARENT_WIDTH
					Children:
						Label@MAINMENU_LABEL_TITLE:
							X: 0
							Y: 0 - 28
							Width: PARENT_WIDTH
							Height: 20
							Text: Chrome-MainMenu-Title
							Align: Center
							Font: Bold
							Contrast: True
						Button@SINGLEPLAYER_BUTTON:
							X: 0
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Singleplayer
						Button@MULTIPLAYER_BUTTON:
							X: 150
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Multiplayer
						Button@SETTINGS_BUTTON:
							X: 300
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-Setting-Title
						Button@EXTRAS_BUTTON:
							X: 450
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-ExtraMenu-Title
						Button@CONTENT_BUTTON:
							X: 600
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-ManageContent
						Button@QUIT_BUTTON:
							X: 750
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Quit
				Container@SINGLEPLAYER_MENU:
					Width: PARENT_WIDTH
					Visible: False
					Children:
						Label@SINGLEPLAYER_MENU_TITLE:
							X: 0
							Y: 0 - 28
							Width: PARENT_WIDTH
							Height: 20
							Text: Chrome-MainMenu-Singleplayer
							Align: Center
							Font: Bold
							Contrast: True
						Button@SKIRMISH_BUTTON:
							X: 0
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-SingleplayerMenu-Skirmish
						Button@MISSIONS_BUTTON:
							X: 150
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MissionBrowser-Title
						Button@LOAD_BUTTON:
							X: 300
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-SingleplayerMenu-Load
						Button@ENCYCLOPEDIA_BUTTON:
							X: 450
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-Cnc-EncyclopediaTitle
						Button@BACK_BUTTON:
							Key: escape
							X: 600
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Back
				Container@EXTRAS_MENU:
					Width: PARENT_WIDTH
					Visible: False
					Children:
						Label@EXTRAS_MENU_TITLE:
							X: 0
							Y: 0 - 28
							Width: PARENT_WIDTH
							Height: 20
							Text: Chrome-ExtraMenu-Title
							Align: Center
							Font: Bold
							Contrast: True
						Button@REPLAYS_BUTTON:
							X: 0
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-ExtraMenu-Replay
						Button@MUSIC_BUTTON:
							X: 150
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-Lobby-Music
						Button@MAP_EDITOR_BUTTON:
							X: 300
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-ExtraMenu-MapEditor
