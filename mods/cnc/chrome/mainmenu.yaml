						Button@ASSETBROWSER_BUTTON:
							X: 450
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-ExtraMenu-AssetBrowser
						Button@CREDITS_BUTTON:
							X: 600
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Back
						Button@BACK_BUTTON:
							Key: escape
							X: 750
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Back
				Container@MAP_EDITOR_MENU:
					Width: PARENT_WIDTH
					Visible: False
					Children:
						Label@MAP_EDITOR_MENU_TITLE:
							X: 0
							Y: 0 - 28
							Width: PARENT_WIDTH
							Height: 20
							Text: Chrome-ExtraMenu-MapEditor
							Align: Center
							Font: Bold
							Contrast: True
						Button@NEW_MAP_BUTTON:
							X: 0
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MapEditorMenu-NewMap
							Font: Bold
						Button@LOAD_MAP_BUTTON:
							X: 150
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MapEditorMenu-LoadMap
							Font: Bold
						Button@BACK_BUTTON:
							X: 300
							Y: 0
							Width: 140
							Height: 35
							Text: Chrome-MainMenu-Back
							Font: Bold
							Key: escape
		Container@NEWS_BG:
			Children:
				DropDownButton@NEWS_BUTTON:
					X: (WINDOW_WIDTH - WIDTH) / 2
					Y: 50
					Width: 400
					Height: 25
					Text: Chrome-MainMenu-NewButton
					Font: Bold
		Container@UPDATE_NOTICE:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: 75
			Width: 128
			Children:
				Label@A:
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Shadow: true
					Text: Chrome-MainMenu-UpdateNoticeLine1
				Label@B:
					Y: 20
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Shadow: true
					Text: Chrome-MainMenu-UpdateNoticeLine2
		Container@PERFORMANCE_INFO:
			Logic: PerfDebugLogic
			Children:
				Label@PERF_TEXT:
					X: WINDOW_WIDTH - WIDTH - 25
					Y: WINDOW_HEIGHT - HEIGHT - 100
					Width: 170
					Contrast: true
					VAlign: Top
				Background@GRAPH_BG:
					X: WINDOW_WIDTH - WIDTH - 31
					Y: 31
					Width: 220
					Height: 220
					Background: panel-black
					Children:
						PerfGraph@GRAPH:
							X: 10
							Y: 10
							Width: 200
							Height: 200
		Container@PLAYER_PROFILE_CONTAINER:
			Logic: LoadLocalPlayerProfileLogic
			X: 31
			Y: 31
