Container@INPUT_PANEL:
	Logic: InputSettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			Children:
				Background@INPUT_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: Chrome-Setting-Input
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@MOUSE_CONTROL_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MOUSE_CONTROL_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: Chrome-Setting-Input-ControlSchema
								DropDownButton@MOUSE_CONTROL_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@ZOOM_MODIFIER_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@ZOOM_MODIFIER_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: Chrome-Setting-Input-ZoomModifier
								DropDownButton@ZOOM_MODIFIER:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@MOUSE_CONTROL_DESC_CLASSIC:
							X: 10
							Y: 55
							Width: PARENT_WIDTH
							Children:
								LabelWithHighlight@DESC_SELECTION:
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-Selection
								LabelWithHighlight@DESC_COMMANDS:
									Y: 17
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-Commands
								LabelWithHighlight@DESC_BUILDINGS:
									Y: 34
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-Buildings
								LabelWithHighlight@DESC_SUPPORT:
									Y: 51
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-Support
								LabelWithHighlight@DESC_ZOOM:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-Zoom
								LabelWithHighlight@DESC_ZOOM_MODIFIER:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-Zoom-modifier
								LabelWithHighlight@DESC_SCROLL_RIGHT:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-ScrollRight
								LabelWithHighlight@DESC_SCROLL_MIDDLE:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-ScrollMiddle
								Label@DESC_EDGESCROLL:
									X: 9
									Y: 102
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ClassicDesc-EdgeScroll
						Container@MOUSE_CONTROL_DESC_MODERN:
							X: 10
							Y: 55
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelWithHighlight@DESC_SELECTION:
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-Selection
								LabelWithHighlight@DESC_COMMANDS:
									Y: 17
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-Commands
								LabelWithHighlight@DESC_BUILDINGS:
									Y: 34
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-Buildings
								LabelWithHighlight@DESC_SUPPORT:
									Y: 51
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-Support
								LabelWithHighlight@DESC_ZOOM:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-Zoom
								LabelWithHighlight@DESC_ZOOM_MODIFIER:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-Zoom-modifier
								LabelWithHighlight@DESC_SCROLL_RIGHT:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-ScrollRight
								LabelWithHighlight@DESC_SCROLL_MIDDLE:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-ScrollMiddle
								Label@DESC_EDGESCROLL:
									X: 9
									Y: 102
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: Chrome-Setting-Input-ModernDesc-EdgeScroll
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@EDGESCROLL_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@EDGESCROLL_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: Chrome-Setting-Input-EdgePanning
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@ALTERNATE_SCROLL_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@ALTERNATE_SCROLL_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: Chrome-Setting-Input-MousePanning
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@LOCKMOUSE_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@LOCKMOUSE_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: Chrome-Setting-Input-LockMouse
				Container@SPACER:
					Height: 30
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@MOUSE_SCROLL_TYPE_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MOUSE_SCROLL_TYPE_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: Chrome-Setting-Input-PanBehaviour
								DropDownButton@MOUSE_SCROLL_TYPE_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@SCROLLSPEED_SLIDER_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@SCROLL_SPEED_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: Chrome-Setting-Input-PaningSpeed
								Slider@SCROLLSPEED_SLIDER:
									Y: 25
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
									MinimumValue: 10
									MaximumValue: 50
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@ZOOMSPEED_SLIDER_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@ZOOM_SPEED_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: Chrome-Setting-Input-ZoomSpeed
								ExponentialSlider@ZOOMSPEED_SLIDER:
									Y: 25
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
									MinimumValue: 0.01
									MaximumValue: 0.4
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@UI_SCROLLSPEED_SLIDER_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@UI_SCROLL_SPEED_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: Chrome-Setting-Input-UiScrollSpeed
								Slider@UI_SCROLLSPEED_SLIDER:
									Y: 25
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
									MinimumValue: 1
									MaximumValue: 100
