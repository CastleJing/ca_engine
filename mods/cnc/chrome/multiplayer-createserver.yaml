Container@MULTIPLAYER_CREATESERVER_PANEL:
	Logic: ServerCreationLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT - 15) / 2
	Width: 530
	Height: 275
	Children:
		Label@TITLE:
			Width: PARENT_WIDTH
			Height: 25
			Y: 0 - 34
			Font: BigBold
			Contrast: true
			Align: Center
			Text: Chrome-MPCreateServer-Title
		Background@bg:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: panel-black
			Children:
				Label@SERVER_NAME_LABEL:
					Y: 14
					Width: 105
					Height: 25
					Align: Right
					Text: Chrome-MPCreateServer-ServerName
				TextField@SERVER_NAME:
					X: 110
					Y: 15
					Width: 215
					MaxLength: 50
					Height: 25
					Text: Chrome-MPCreateServer-ServerNamePlaceHolder
				Label@PASSWORD_LABEL:
					Y: 49
					Width: 105
					Height: 25
					Align: Right
					Text: Chrome-Connection-Password
				PasswordField@PASSWORD:
					X: 110
					Y: 50
					Width: 145
					MaxLength: 20
					Height: 25
				Label@AFTER_PASSWORD_LABEL:
					X: 265
					Y: 49
					Width: 105
					Height: 25
					Align: Left
					Text: Chrome-MPCreateServer-PasswdPlaceHolder
				Label@LISTEN_PORT_LABEL:
					Y: 84
					Width: 105
					Height: 25
					Align: Right
					Text: Chrome-MPCreateServer-Port
				TextField@LISTEN_PORT:
					X: 110
					Y: 85
					Width: 50
					Height: 25
					MaxLength: 5
					Text: Chrome-MPCreateServer-PortPlaceHolder
					Type: Integer
				Checkbox@ADVERTISE_CHECKBOX:
					X: 180
					Y: 87
					Width: 150
					Height: 20
					Font: Regular
					Text: Chrome-MPCreateServer-AdvertiseOnline
				Label@NOTICES_HEADER_A:
					X: 15
					Y: 125
					Height: 25
					Align: Left
					Font: Bold
				Label@NOTICES_HEADER_B:
					X: 15
					Y: 125
					Height: 25
					Align: Left
					Font: Bold
				Label@NOTICES_HEADER_C:
					X: 15
					Y: 125
					Height: 25
					Align: Left
					Font: Bold
				Container@NOTICES_LAN:
					X: 20
					Y: 145
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@ADVERTISING:
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-LanAdvertising
						Label@FIREWALL:
							Y: 12
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-LanFirewall
						Label@PORTFORWARD_A:
							Y: 24
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-LanPortForwardA
						Label@PORTFORWARD_B:
							X: 7
							Y: 36
							Width: 295
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-LanPortForwardB
				Container@NOTICES_NO_UPNP:
					X: 20
					Y: 145
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@ADVERTISING:
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-NoUpnpAdvertising
						Label@FIREWALL:
							Y: 12
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-NoUpnpFirewall
						Label@PORTFORWARD_A:
							Y: 24
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-NoUpnpPortForwardA
						Label@PORTFORWARD_B:
							X: 7
							Y: 36
							Width: 295
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-NoUpnpPortForwardB
						Label@SETTINGS_A:
							Y: 48
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-NoUpnpSettingsA
						Label@SETTINGS_B:
							X: 7
							Y: 60
							Width: 295
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-NoUpnpSettingsB
				Container@NOTICES_UPNP:
					X: 20
					Y: 145
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@ADVERTISING:
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-UpnpAdvertising
						Label@FIREWALL:
							Y: 12
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-UpnpFirewall
						Label@PORTFORWARD_A:
							Y: 24
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-UpnpPortForward
						Label@SETTINGS_A:
							Y: 36
							Width: 305
							Height: 25
							Font: Tiny
							Align: Left
							Text: Chrome-MPCreateServer-Notice-UpnpSettingsA
				Container@MAP_PREVIEW_ROOT:
					X: PARENT_WIDTH - 189
					Y: 15
					Width: 174
					Height: 250
		Button@BACK_BUTTON:
			Key: return
			Y: PARENT_HEIGHT - 1
			Width: 140
			Height: 35
			Text: Chrome-MPCreateServer-BackButton
		Button@MAP_BUTTON:
			X: PARENT_WIDTH - WIDTH - 150
			Y: PARENT_HEIGHT - 1
			Width: 140
			Height: 35
			Text: Chrome-MPCreateServer-ChangeMap
		Button@CREATE_BUTTON:
			Key: return
			X: PARENT_WIDTH - WIDTH
			Y: PARENT_HEIGHT - 1
			Width: 140
			Height: 35
			Text: Chrome-MPCreateServer-OkButton
		TooltipContainer@TOOLTIP_CONTAINER:
