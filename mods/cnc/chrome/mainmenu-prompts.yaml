		Label@PROMPT_TITLE:
			Width: PARENT_WIDTH
			Height: 25
			Y: 0 - 37
			Font: BigBold
			Contrast: true
			Align: Center
			Text: Chrome-MainMenu-Prompts-PromptTitle
