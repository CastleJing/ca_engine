											Text: Chrome-Setting-Player-DoubleMouse
		Button@CONTINUE_BUTTON:
			X: PARENT_WIDTH - WIDTH
			Y: PARENT_HEIGHT - 1
			Width: 140
			Height: 35
			Text: button-continue
			Font: Bold
			Key: return

Container@MAINMENU_SYSTEM_INFO_PROMPT:
