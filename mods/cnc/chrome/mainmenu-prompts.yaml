							Children:
								Label@LABEL:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Font: TinyBold
									Align: Center
									Text: Chrome-Setting-Display
						Container@ROW:
							Width: PARENT_WIDTH
							Height: 50
							Children:
