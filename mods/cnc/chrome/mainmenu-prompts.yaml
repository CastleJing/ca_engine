											Y: 102
											Width: PARENT_WIDTH
											Height: 16
											Font: Small
											Text: Chrome-Setting-Input-ModernDesc-EdgeScroll
						Container@ROW:
							Width: PARENT_WIDTH
							Height: 20
							Children:
								Container@EDGESCROLL_CHECKBOX_CONTAINER:
									X: 10
									Width: PARENT_WIDTH / 2 - 20
									Children:
										Checkbox@EDGESCROLL_CHECKBOX:
											Width: PARENT_WIDTH
											Height: 20
											Font: Regular
											Text: Chrome-Setting-Input-EdgePanning
						Container@SPACER:
							Height: 30
						Background@DISPLAY_SECTION_HEADER:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 13
							Background: separator
